<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Country</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --ink:#10161c; --panel:#161f27; --panel-2:#1c2731; --paper:#eee7d8;
    --brass:#c99a4b; --brass-bright:#e2b869; --teal:#4d8a80; --red:#c1594a;
    --line: rgba(238,231,216,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(26px,5vw,38px);margin:0;}
  .brand h1 span{color:var(--brass-bright);}
  .brand .tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);border:1px solid var(--teal);padding:5px 10px;border-radius:99px;}
  .scorebar{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .stamp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;flex:1;min-width:110px;text-align:center;}
  .stamp b{display:block;font-family:'Fraunces',serif;font-size:20px;color:var(--brass-bright);}
  .stamp small{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9aa3ab;}
  .clue-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .cat-badge{font-family:'Fraunces',serif;font-weight:700;font-size:14px;background:var(--brass-bright);color:#241a08;padding:6px 14px;border-radius:99px;}
  .clue-count{font-size:12px;color:#9aa3ab;}
  .photo-frame{position:relative;border-radius:14px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);min-height:220px;display:flex;align-items:center;justify-content:center;}
  .photo-frame img{width:100%;max-height:340px;object-fit:cover;display:block;}
  .photo-frame .loading{color:#8b939b;font-size:14px;padding:20px;text-align:center;}
  .photo-frame .cred{position:absolute;bottom:8px;right:10px;font-size:10px;color:#e8e0cc;background:rgba(0,0,0,0.45);padding:3px 8px;border-radius:99px;}
  .flag-big{font-size:120px;line-height:1;}
  .flag-icon{width:22px;height:16px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(238,231,216,0.15);vertical-align:middle;}
  .flag-big-img{width:240px;max-width:80%;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.45);}
  .flag-inline{width:20px;height:15px;object-fit:cover;border-radius:2px;vertical-align:middle;margin-right:4px;}
  .emoji-big{font-size:64px;letter-spacing:12px;}
  .currency-big{font-family:'Fraunces',serif;font-size:30px;color:var(--brass-bright);text-align:center;padding:0 20px;}
  .hint-text{margin:12px 0 18px;font-size:15px;color:#d7d0bd;background:var(--panel);border-left:3px solid var(--brass-bright);padding:12px 16px;border-radius:0 8px 8px 0;}
  .wrong-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:22px;}
  .wrong-chip{font-size:12px;color:#8b939b;background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:99px;text-decoration:line-through;}
  .search-row{margin-bottom:10px;}
  .search-row input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;}
  .search-row input:focus{outline:none;border-color:var(--brass);}
  .country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;overflow-y:auto;padding-right:4px;}
  .country-btn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--paper);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;text-align:left;transition:transform .1s ease, border-color .1s ease;}
  .country-btn:hover{border-color:var(--brass);transform:translateY(-1px);}
  .country-btn .flag{font-size:18px;}
  .country-btn:disabled{opacity:0.25;cursor:not-allowed;text-decoration:line-through;}
  .result{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:none;}
  .result.show{display:block;}
  .result h3{font-family:'Fraunces',serif;margin:0 0 6px;font-size:20px;}
  .result.correct h3{color:var(--teal);}
  .result.fail h3{color:var(--red);}
  .result .pts{float:right;font-family:'Fraunces',serif;font-size:26px;color:var(--brass-bright);}
  .result button{margin-top:10px;}
  .final{text-align:center;padding:30px 10px;}
  .final h2{font-family:'Fraunces',serif;font-size:clamp(28px,6vw,44px);margin-bottom:6px;}
  .final .rank{color:var(--brass-bright);font-size:18px;margin-bottom:18px;}
  .final .big{font-family:'Fraunces',serif;font-size:52px;color:var(--brass-bright);}
  .roundlog{text-align:left;max-width:480px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px;}
  .roundlog div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .roundlog div:last-child{border-bottom:none;}
  button.primary{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:12px 22px;border-radius:99px;border:none;cursor:pointer;background:var(--brass-bright);color:#241a08;transition:transform .15s ease, background .15s ease;}
  button.primary:hover{transform:translateY(-1px);background:#f0c987;}
  @media (max-width:600px){.stamp{min-width:85px;padding:8px 10px;} .stamp b{font-size:16px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Guess the <span>Country</span></h1>
    <div class="tag">5 rounds · 60 countries · 7 categories</div>
  </div>
  <div class="scorebar">
    <div class="stamp"><b id="roundNo">1 / 5</b><small>Round</small></div>
    <div class="stamp"><b id="totalScore">0</b><small>Total Score</small></div>
    <div class="stamp"><b id="lastPts">—</b><small>Last Round</small></div>
  </div>
  <div id="game">
    <div class="clue-head">
      <span class="cat-badge" id="catBadge">—</span>
      <span class="clue-count" id="clueCount"></span>
    </div>
    <div class="photo-frame" id="photoFrame"><div class="loading">Loading clue…</div></div>
    <p class="hint-text" id="hintText"></p>
    <div class="wrong-list" id="wrongList"></div>
    <div class="search-row"><input type="text" id="searchBox" placeholder="Search a country and click…" autocomplete="off"></div>
    <div class="country-grid" id="countryGrid"></div>
    <div class="result" id="resultPanel">
      <span class="pts" id="resultPts"></span>
      <h3 id="resultTitle"></h3>
      <p id="resultBody"></p>
      <button class="primary" id="nextBtn">Next Round →</button>
    </div>
  </div>
  <div id="finalScreen" style="display:none;" class="final">
    <h2>Game Over</h2>
    <div class="rank" id="rankText"></div>
    <div class="big" id="finalScore"></div>
    <p style="color:#9aa3ab;margin-top:6px;">/ 5000 points</p>
    <div class="roundlog" id="roundLog"></div>
    <button class="primary" id="restartBtn" style="margin-top:10px;">Play Again</button>
  </div>
</div>

}

}

const EXTRA_NAMES = {NA:'Namibia', CM:'Cameroon', CI:'Ivory Coast', GM:'Gambia'};
function countryName(code){ return (C[code] && C[code].n) || EXTRA_NAMES[code] || code; }

const ALL_CODES = Object.keys(C).sort((a,b) => C[a].n.localeCompare(C[b].n));
const TOTAL_ROUNDS = 5;
let roundOrder = [], currentRound = 0, totalScore = 0, roundLog = [];
let cluePool = [], clueIndex = 0, currentCode = null, wrongCodes = new Set(), roundLocked = false;
const usedClueKeys = new Set(); // prevents repeats within this session

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildPool(code){
  const d = C[code];
  let pool = [];
  d.b.forEach(n => pool.push({cat:'Neighbor', key:code+'|Neighbor|'+n, neighbor:n}));
  pool.push({cat:'Currency', key:code+'|Currency'});
  pool.push({cat:'Emoji', key:code+'|Emoji'});
  ['Geo','Music','Film','History'].forEach(catKey => {
    const arrKey = {Geo:'g',Music:'m',Film:'f',History:'h'}[catKey];
    (d[arrKey]||[]).forEach((clue,i) => pool.push({cat:catKey, key:code+'|'+catKey+'|'+i, title:clue[0], hint:clue[1]}));
  });
  let fresh = pool.filter(p => !usedClueKeys.has(p.key));
  if(fresh.length === 0) fresh = pool; // if everything has been used before, allow repeats as a fallback
  return shuffle(fresh);
}

function startGame(){
  roundOrder = shuffle(ALL_CODES).slice(0, TOTAL_ROUNDS);
  currentRound = 0; totalScore = 0; roundLog = [];
  document.getElementById('totalScore').textContent = '0';
  document.getElementById('lastPts').textContent = '—';
  document.getElementById('finalScreen').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  renderCountryGrid();
  loadRound();
}

function renderCountryGrid(filter){
  const grid = document.getElementById('countryGrid');
  grid.innerHTML = '';
  const f = (filter || '').toLowerCase();
  ALL_CODES.forEach(code => {
    const name = countryName(code);
    if(f && !name.toLowerCase().includes(f)) return;
    const btn = document.createElement('button');
    btn.className = 'country-btn';
    btn.innerHTML = flagIconHtml(code)+'<span>'+name+'</span>';
    if(wrongCodes.has(code) || roundLocked) btn.disabled = true;
    btn.addEventListener('click', () => handleGuess(code, name));
    grid.appendChild(btn);
  });
}
document.getElementById('searchBox').addEventListener('input', e => renderCountryGrid(e.target.value));

function loadRound(){
  roundLocked = false; wrongCodes = new Set(); clueIndex = 0;
  currentCode = roundOrder[currentRound];
  cluePool = buildPool(currentCode);
  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('roundNo').textContent = (currentRound+1) + ' / ' + TOTAL_ROUNDS;
  document.getElementById('wrongList').innerHTML = '';
  document.getElementById('searchBox').value = '';
  renderCountryGrid();
  loadClue();
}

function loadClue(){
  const clue = cluePool[clueIndex];
  usedClueKeys.add(clue.key);
  document.getElementById('catBadge').textContent = CATS[clue.cat].label;
  document.getElementById('clueCount').textContent = 'Clue ' + (clueIndex+1) + ' / ' + cluePool.length;
  const frame = document.getElementById('photoFrame');
  const hintEl = document.getElementById('hintText');

  if(clue.cat === 'Neighbor'){
    frame.innerHTML = '<img class="flag-big-img" src="'+flagUrl(clue.neighbor)+'" alt="neighbor flag">';
    hintEl.textContent = 'This is the flag of a country near the target country.';
  } else if(clue.cat === 'Currency'){
    frame.innerHTML = '<div class="currency-big">💰 '+C[currentCode].c+'</div>';
    hintEl.textContent = 'This is the official currency of the target country.';
  } else if(clue.cat === 'Emoji'){
    frame.innerHTML = '<div class="emoji-big">'+C[currentCode].e+'</div>';
    hintEl.textContent = 'These three emoji describe the target country.';
  } else {
    frame.innerHTML = '<div class="loading">Loading clue…</div>';
    hintEl.textContent = clue.hint;
    fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(clue.title))
      .then(r => r.json())
      .then(data => {
        const src = (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source);
        frame.innerHTML = src ? ('<img src="'+src+'" alt="clue"><div class="cred">Wikipedia</div>') : '<div class="loading">No image found — trust the hint text!</div>';
      })
      .catch(() => { frame.innerHTML = '<div class="loading">Image failed to load — trust the hint text!</div>'; });
  }
}

function handleGuess(code, name){
  if(roundLocked) return;
  if(code === currentCode){
    roundLocked = true;
    const pts = Math.max(100, Math.round(1000 * Math.pow(0.75, clueIndex)));
    totalScore += pts;
    roundLog.push({country: C[currentCode].n, clue: clueIndex+1, pts});
    document.getElementById('totalScore').textContent = totalScore.toLocaleString('en-US');
    document.getElementById('lastPts').textContent = pts.toLocaleString('en-US');
    const panel = document.getElementById('resultPanel');
    panel.className = 'result show correct';
    document.getElementById('resultPts').textContent = '+' + pts;
    document.getElementById('resultTitle').innerHTML = flagInlineHtml(currentCode) + ' Correct! ' + C[currentCode].n;
    document.getElementById('resultBody').textContent = 'Solved on clue ' + (clueIndex+1) + '.';
    renderCountryGrid(document.getElementById('searchBox').value);
  } else {
    wrongCodes.add(code);
    renderCountryGrid(document.getElementById('searchBox').value);
    const wl = document.getElementById('wrongList');
    const chip = document.createElement('span');
    chip.className = 'wrong-chip';
    chip.innerHTML = flagInlineHtml(code) + name;
    wl.appendChild(chip);
    clueIndex++;
    if(clueIndex >= cluePool.length){
      roundLocked = true;
      roundLog.push({country: C[currentCode].n, clue: null, pts: 0});
      document.getElementById('lastPts').textContent = '0';
      const panel = document.getElementById('resultPanel');
      panel.className = 'result show fail';
      document.getElementById('resultPts').textContent = '+0';
      document.getElementById('resultTitle').innerHTML = flagInlineHtml(currentCode) + ' Not guessed';
      document.getElementById('resultBody').textContent = 'The correct answer was ' + C[currentCode].n + '.';
      renderCountryGrid(document.getElementById('searchBox').value);
    } else {
      loadClue();
    }
  }
}

document.getElementById('nextBtn').addEventListener('click', function(){
  currentRound++;
  if(currentRound >= TOTAL_ROUNDS) showFinal(); else loadRound();
});

function showFinal(){
  document.getElementById('game').style.display = 'none';
  document.getElementById('finalScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = totalScore.toLocaleString('en-US');
  let rank;
  if(totalScore >= 4000) rank = '🏆 Legendary Explorer';
  else if(totalScore >= 2500) rank = '🕵️ Master Detective';
  else if(totalScore >= 1200) rank = '🧭 Keen Traveler';
  else rank = '🌱 Rookie Explorer';
  document.getElementById('rankText').textContent = rank;
  const log = document.getElementById('roundLog');
  log.innerHTML = '';
  roundLog.forEach((r,i) => {
    const row = document.createElement('div');
    const clueTxt = r.clue ? ('clue ' + r.clue) : 'not guessed';
    row.innerHTML = '<span>Round '+(i+1)+' · '+r.country+' <small style="color:#8b939b;">('+clueTxt+')</small></span><b style="color:var(--brass-bright);">+'+r.pts+'</b>';
    log.appendChild(row);
  });
}

document.getElementById('restartBtn').addEventListener('click', startGame);
startGame();
</script>
